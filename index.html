<title>DEANN FF — Links Oficiais & CUP DEAN</title>

<style>
:root{--bg:#f4f4f8;--fg:#14141c;--card:#fff;--bd:#dcdce6;--mut:#5c5c70;--ac:#e11d48;--ac2:#7c3aed;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#030305;--fg:#f3f3f8;--card:#12121a;--bd:#262634;--mut:#9a9ab0}}
:root[data-theme="dark"]{--bg:#030305;--fg:#f3f3f8;--card:#12121a;--bd:#262634;--mut:#9a9ab0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:520px;margin:0 auto;padding:28px 16px 40px}
.hd{text-align:center;margin-bottom:22px}
.logo{width:72px;height:72px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:30px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2))}
h1{margin:0;font-size:28px;letter-spacing:1px}
.sub{color:var(--mut);margin:4px 0 0}
.links{display:grid;gap:10px}
.lk{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
.lk:hover{transform:translateY(-2px);border-color:var(--ac)}
.ic{font-size:24px;width:40px;text-align:center}
.tx{flex:1;min-width:0}.tx b{display:block}.tx span{color:var(--mut);font-size:13px}
.bd{background:var(--ac);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
.cup{margin-top:26px;padding:20px;border-radius:16px;background:var(--card);border:1px solid var(--bd);text-align:center}
.cup h2{margin:0 0 4px}.tag{color:var(--ac);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;text-align:left}
.grid div{background:var(--bg);border-radius:10px;padding:10px;font-size:14px}.grid small{display:block;color:var(--mut)}
.btn{display:inline-block;border:0;cursor:pointer;font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));padding:12px 20px;border-radius:12px;text-decoration:none}
.btn.sec{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
.ft{text-align:center;margin-top:24px}
.ed{margin-top:20px}
.row{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px;display:grid;gap:6px}
.row input[type=text]{width:100%;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit}
.r2{display:grid;grid-template-columns:70px 1fr 90px;gap:6px}
.act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.act button{padding:6px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);cursor:pointer}
.msg{margin:10px 0;padding:10px;border-radius:10px;background:var(--bg);border:1px solid var(--ac);font-size:14px}
label{font-size:13px;color:var(--mut)}
:root{--bg:#F3F4F8;--card:#fff;--bd:#DADFEA;--fg:#0F1424;--mut:#5A6379;--ac:#B85200;--on:#fff;--hov:#F3F4F8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0E1A;--card:#121829;--bd:#222B42;--fg:#EEF0F5;--mut:#8B94AB;--ac:#FF8A1F;--on:#1A0F00;--hov:#182036}}
:root[data-theme="dark"]{--bg:#0A0E1A;--card:#121829;--bd:#222B42;--fg:#EEF0F5;--mut:#8B94AB;--ac:#FF8A1F;--on:#1A0F00;--hov:#182036}
body{font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
main{max-width:560px;padding:32px 18px 48px}
.hd{display:grid;grid-template-columns:64px 1fr;column-gap:16px;align-items:center;text-align:left;margin-bottom:28px}
.logo{grid-row:1/3;width:64px;height:64px;margin:0;border-radius:14px;background:var(--ac);color:var(--on);box-shadow:none;font-family:"Barlow Condensed",system-ui,sans-serif;font-size:40px;font-weight:800}
h1{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:42px;font-weight:800;letter-spacing:.02em;line-height:1}
.sub{color:var(--mut);margin:6px 0 0;font-size:15px}
.lbl{font-size:13px;font-weight:600;color:var(--mut);margin:0 2px 8px}
.links{display:block;background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.lk{padding:14px 16px;border:0;border-bottom:1px solid var(--bd);border-radius:0;background:transparent;transition:background .15s}
.links .lk:last-child{border-bottom:0}
.lk:hover{transform:none;background:var(--hov)}
.ic{width:42px;height:42px;display:grid;place-items:center;font-size:21px;background:var(--bg);border:1px solid var(--bd);border-radius:10px}
.tx b{font-weight:700}.tx span{font-size:14px}
.chev{color:var(--mut);font-size:24px;line-height:1}
.bd{display:flex;align-items:center;gap:6px;background:var(--ac);color:var(--on);font-size:12px;font-weight:700;padding:3px 10px}
.bd::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--on);animation:pl 1.4s ease-in-out infinite}
@keyframes pl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.bd::before{animation:none}.lk{transition:none}}
.cup{margin-top:28px;padding:22px;overflow:hidden;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:14px}
.cup::before{content:"";display:block;height:8px;margin:-22px -22px 20px;background:repeating-linear-gradient(-45deg,var(--ac) 0 10px,transparent 10px 20px)}
.cup h2{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:40px;font-weight:800;line-height:1;margin:4px 0 6px}
.tag{color:var(--ac);font-size:14px;font-weight:700;text-transform:none;letter-spacing:0}
.grid{gap:10px;margin:18px 0}
.grid .st{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;font-size:15px}
.grid .st.wide{grid-column:1/-1}
.st .k{display:block;font-size:13px;font-weight:600;color:var(--mut)}
.st .v{display:block;font-weight:700;margin-top:2px}
.grid .st.hl .v{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:38px;font-weight:800;line-height:1.05;color:var(--ac)}
.btn{background:var(--ac);color:var(--on);border-radius:10px;padding:14px 20px;font-weight:700}
.btn.blk{display:block;text-align:center}
.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--bd)}
.ft{text-align:left;margin-top:18px}
.foot{color:var(--mut);font-size:13px;margin-top:30px}
.ed h2{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:28px;margin:0 0 12px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

    const t=el('div','tx');t.append(el('b',null,l.titulo),el('span',null,l.descricao));
    a.append(el('div','ic',l.icone||'🔗'),t);
    if(l.badge)a.append(el('span','bd',l.badge));a.append(el('span','chev','›'));
    box.append(a);
  });
  m.append(el('div','lbl','Links oficiais'),box);

  const c=el('section','cup');
  c.append(el('div','tag','Campeonato oficial'),el('h2',null,'CUP DEAN'));
  c.append(el('p','sub','Modo Squad · Exclusivo para Free Fire versão 2019'));
  const g=el('div','grid');
  [['Prêmio do time campeão','R$ 100,00','hl wide'],['Data','05 de Dezembro',''],['Formato','4 titulares + 1 reserva',''],['MVP (troféu enviado via Correios)','1 codiguin + troféu físico','wide']].forEach(([k,v,x])=>{
    const d=el('div','st '+x);d.append(el('span','k',k),el('span','v',v));g.append(d);
  });
  c.append(g);
  if(ok(S.inscricao)){const b=el('a','btn blk','Inscrever meu squad');b.href=S.inscricao;b.target='_blank';b.rel='noopener noreferrer';c.append(b)}
  m.append(c);

  if(admin&&art){
    const f=el('div','ft');
    if(!editing){const b=el('button','btn sec','⚙ Editar links');b.onclick=()=>{draft=JSON.parse(JSON.stringify(S));editing=true;note='';render()};f.append(b)}
    m.append(f);
    if(editing)m.append(editor());
  }
  m.append(el('p','foot','© 2026 DEANN FF'));app.append(m);
}

function editor(){
  const w=el('div','ed');
  w.append(el('h2',null,'Painel de links'));
  if(note)w.append(el('div','msg',note));
  draft.links.forEach((l,i)=>{
    const r=el('div','row');
    const inp=(k,ph)=>{const x=el('input');x.type='text';x.placeholder=ph;x.value=l[k]||'';x.oninput=()=>{l[k]=x.value};return x};
    const r2=el('div','r2');r2.append(inp('icone','Ícone'),inp('titulo','Título'),inp('badge','Selo'));
    const act=el('div','act');
    const lb=el('label');const cb=el('input');cb.type='checkbox';cb.checked=!!l.ativo;cb.onchange=()=>{l.ativo=cb.checked};
    lb.append(cb,document.createTextNode(' Ativo'));
    const mv=(d,txt)=>{const b=el('button',null,txt);b.onclick=()=>{const j=i+d;if(j<0||j>=draft.links.length)return;[draft.links[i],draft.links[j]]=[draft.links[j],draft.links[i]];render()};return b};
    const del=el('button',null,'Excluir');del.onclick=()=>{if(confirm('Excluir “'+(l.titulo||'sem título')+'”?')){draft.links.splice(i,1);render()}};
    act.append(lb,mv(-1,'↑'),mv(1,'↓'),del);
    r.append(r2,inp('descricao','Descrição'),inp('url','https://...'),act);
    w.append(r);
  });
  const add=el('button','btn sec','+ Adicionar link');
  add.onclick=()=>{draft.links.push({titulo:'',descricao:'',url:'https://',icone:'🔗',badge:'',ativo:true});render()};
  const ins=el('div','row');ins.append(el('label',null,'Link do botão “Inscrever meu squad”'));
  const ii=el('input');ii.type='text';ii.value=draft.inscricao;ii.oninput=()=>{draft.inscricao=ii.value};ins.append(ii);
  draft.discord=draft.discord||{url:'https://',ativo:false};
  const dc=el('div','row');const dl=el('label');const dcb=el('input');dcb.type='checkbox';dcb.checked=!!draft.discord.ativo;dcb.onchange=()=>{draft.discord.ativo=dcb.checked};dl.append(dcb,document.createTextNode(' Mostrar pop-up da call do Discord'));
  const di=el('input');di.type='text';di.value=draft.discord.url;di.oninput=()=>{draft.discord.url=di.value};dc.append(dl,di);
  const bar=el('div','act');bar.style.marginTop='12px';
  const sv=el('button','btn','Salvar alterações');sv.onclick=save;
  const cn=el('button','btn sec','Cancelar');cn.onclick=()=>{editing=false;render()};
  bar.append(sv,cn);
  w.append(add,el('div'),ins,dc,bar);
  return w;
}

function showPop(){
  const d=S.discord;
  if(!d||!d.ativo||!ok(d.url))return;
  try{if(sessionStorage.getItem('pop'))return}catch(e){}
  const o=el('div','pop');o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-labelledby','pt');
  const c=el('div','pc');
  const kd=e=>{if(e.key==='Escape')close()};
  const close=()=>{o.remove();document.removeEventListener('keydown',kd);try{sessionStorage.setItem('pop','1')}catch(e){}};
  const x=el('button','px','×');x.setAttribute('aria-label','Fechar');x.onclick=close;
  const lg=el('div','dl');lg.innerHTML=DSVG;
  const h=el('h3',null,'Entre na call do Discord');h.id='pt';
  const go=el('a','btn blk','Entrar na call');go.href=d.url;go.target='_blank';go.rel='noopener noreferrer';go.onclick=()=>setTimeout(close,0);
  const no=el('button','pn','Agora não');no.onclick=close;
  c.append(x,lg,h,el('p',null,'Toque no botão para entrar na call do DEANN FF no Discord.'),go,no);
  o.append(c);o.onclick=e=>{if(e.target===o)close()};
  document.addEventListener('keydown',kd);document.body.append(o);go.focus();
}
setTimeout(showPop,700);
async function save(){
  const bad=draft.links.find(l=>!l.titulo.trim()||!ok(l.url));
  if(bad){note='Todo link precisa de título e URL começando com https:// ('+(bad.titulo||'item sem título')+').';render();return}
  if(!ok(draft.inscricao)){note='O link de inscrição precisa começar com https://.';render();return}
  if(draft.discord&&draft.discord.ativo&&!ok(draft.discord.url)){note='O link do Discord precisa começar com https://.';render();return}
  const clone=document.documentElement.cloneNode(true);
  clone.querySelector('#app').textContent='';
  clone.querySelectorAll('.pop').forEach(n=>n.remove());
  clone.querySelector('#data').textContent=JSON.stringify(draft).replace(/</g,'\\u003c');
  try{await art.publish('<!doctype html>\n'+clone.outerHTML)}
  catch(e){note='Não foi possível salvar ('+(e&&(e.code||e.message)||'erro')+').';render()}
}

render();
(async()=>{
  try{
    if(!window.claude)return;
    const u=await claude.use('user');
    admin=!!(u&&await u.isOwner());
    if(admin){art=await claude.use('artifact');render()}
  }catch(e){}
})();
</script>
